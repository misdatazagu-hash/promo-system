<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zagu Promo 5 Flavors Entry</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; background-color: #28a745; color: white; padding: 15px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 20px; font-weight: bold; }
        button:hover { background-color: #218838; }
        .alert { background-color: #d4edda; color: #155724; padding: 15px; border-radius: 5px; text-align: center; margin-bottom: 20px; font-weight: bold; }
        
        .flavor-section { background: #fdfdfd; border: 1px solid #e0e0e0; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .flavor-section h3 { margin-top: 0; margin-bottom: 10px; color: #2c3e50; font-size: 16px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .sizes-row { display: flex; gap: 10px; }
        .size-col { flex: 1; }
        .size-col label { font-size: 12px; font-weight: bold; color: #666; text-align: center; margin-bottom: 3px; }
        .size-col input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Zagu Promo 5 Flavors Entry</h2>
        
        {% if success %}
            <div class="alert">Successfully Submitted! Pwede ka nang mag-submit ng panibago.</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="unique_code">Please enter the UNIQUE CODE * (Ex. ZAGU or ZAGU01)</label>
                <input type="text" id="unique_code" name="unique_code" required placeholder="Enter unique code">
            </div>

            <div class="form-group">
                <label for="month">MONTH *</label>
                <select id="month" name="month" required>
                    <option value="">Select Month</option>
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    <option value="April">April</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="July">July</option>
                    <option value="August">August</option>
                    <option value="September">September</option>
                    <option value="October">October</option>
                    <option value="November">November</option>
                    <option value="December">December</option>
                </select>
            </div>

            <div class="form-group">
                <label for="day">DAY *</label>
                <select id="day" name="day" required>
                    <option value="">Select Day</option>
                    {% for d in range(1, 32) %}
                        <option value="{{ d }}">{{ d }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Flavor Sections -->
            <div class="flavor-section">
                <h3>1. Mais Con Yelo</h3>
                <div class="sizes-row">
                    <div class="size-col"><label>BBZ Cup</label><input type="number" name="mcy_bbz" value="0" min="0" required></div>
                    <div class="size-col"><label>Regular Cup</label><input type="number" name="mcy_reg" value="0" min="0" required></div>
                    <div class="size-col"><label>Grande Cup</label><input type="number" name="mcy_grande" value="0" min="0" required></div>
                </div>
            </div>

            <div class="flavor-section">
                <h3>2. Creme Brulee</h3>
                <div class="sizes-row">
                    <div class="size-col"><label>BBZ Cup</label><input type="number" name="cb_bbz" value="0" min="0" required></div>
                    <div class="size-col"><label>Regular Cup</label><input type="number" name="cb_reg" value="0" min="0" required></div>
                    <div class="size-col"><label>Grande Cup</label><input type="number" name="cb_grande" value="0" min="0" required></div>
                </div>
            </div>

            <div class="flavor-section">
                <h3>3. Red Velvet Classic</h3>
                <div class="sizes-row">
                    <div class="size-col"><label>BBZ Cup</label><input type="number" name="rvc_bbz" value="0" min="0" required></div>
                    <div class="size-col"><label>Regular Cup</label><input type="number" name="rvc_reg" value="0" min="0" required></div>
                    <div class="size-col"><label>Grande Cup</label><input type="number" name="rvc_grande" value="0" min="0" required></div>
                </div>
            </div>

            <div class="flavor-section">
                <h3>4. Red Velvet Crunch</h3>
                <div class="sizes-row">
                    <div class="size-col"><label>BBZ Cup</label><input type="number" name="rvcr_bbz" value="0" min="0" required></div>
                    <div class="size-col"><label>Regular Cup</label><input type="number" name="rvcr_reg" value="0" min="0" required></div>
                    <div class="size-col"><label>Grande Cup</label><input type="number" name="rvcr_grande" value="0" min="0" required></div>
                </div>
            </div>

            <div class="flavor-section">
                <h3>5. Red Velvet Cheesecake</h3>
                <div class="sizes-row">
                    <div class="size-col"><label>BBZ Cup</label><input type="number" name="rvcc_bbz" value="0" min="0" required></div>
                    <div class="size-col"><label>Regular Cup</label><input type="number" name="rvcc_reg" value="0" min="0" required></div>
                    <div class="size-col"><label>Grande Cup</label><input type="number" name="rvcc_grande" value="0" min="0" required></div>
                </div>
            </div>

            <button type="submit">Submit All Data</button>
        </form>
    </div>
</body>
</html>
