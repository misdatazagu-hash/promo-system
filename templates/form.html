<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Promo Monitoring Form</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 650px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="number"], input[type="date"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .flavor-section { background: #f9f9fb; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #e1e1e8; }
        .flavor-section h4 { margin-top: 0; color: #2c3e50; }
        .size-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        button { background-color: #4CAF50; color: white; padding: 12px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #45a049; }
        hr { margin: 25px 0; border: 0; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Daily Promo Monitoring Form</h2>
        <form action="/submit" method="POST">
            
            <div class="form-group">
                <label>Report Date (Select the actual date of sales):</label>
                <input type="date" name="report_date" required>
            </div>

            <div class="form-group">
                <label>Unique Code / BP Code:</label>
                <input type="text" name="bp_code" required>
            </div>

            <div class="form-group">
                <label>Business Name:</label>
                <input type="text" name="business_name" required>
            </div>

            <div class="form-group">
                <label>Region:</label>
                <input type="text" name="region" required>
            </div>

            <div class="form-group">
                <label>Store Name:</label>
                <input type="text" name="store_name" required>
            </div>

            <hr>
            <h3>Promo Product Quantities by Size</h3>

            <!-- Mais Con Yelo -->
            <div class="flavor-section">
                <h4>Mais Con Yelo</h4>
                <div class="size-grid">
                    <div><label>BBZ</label><input type="number" name="mais_bbz" value="0" min="0" required></div>
                    <div><label>Regular</label><input type="number" name="mais_reg" value="0" min="0" required></div>
                    <div><label>Grande</label><input type="number" name="mais_grd" value="0" min="0" required></div>
                </div>
            </div>

            <!-- Creme Brulee -->
            <div class="flavor-section">
                <h4>Creme Brulee</h4>
                <div class="size-grid">
                    <div><label>BBZ</label><input type="number" name="creme_bbz" value="0" min="0" required></div>
                    <div><label>Regular</label><input type="number" name="creme_reg" value="0" min="0" required></div>
                    <div><label>Grande</label><input type="number" name="creme_grd" value="0" min="0" required></div>
                </div>
            </div>

            <!-- Red Velvet Crunch -->
            <div class="flavor-section">
                <h4>Red Velvet Crunch</h4>
                <div class="size-grid">
                    <div><label>BBZ</label><input type="number" name="rvc_bbz" value="0" min="0" required></div>
                    <div><label>Regular</label><input type="number" name="rvc_reg" value="0" min="0" required></div>
                    <div><label>Grande</label><input type="number" name="rvc_grd" value="0" min="0" required></div>
                </div>
            </div>

            <!-- Red Velvet Cheesecake -->
            <div class="flavor-section">
                <h4>Red Velvet Cheesecake</h4>
                <div class="size-grid">
                    <div><label>BBZ</label><input type="number" name="rvch_bbz" value="0" min="0" required></div>
                    <div><label>Regular</label><input type="number" name="rvch_reg" value="0" min="0" required></div>
                    <div><label>Grande</label><input type="number" name="rvch_grd" value="0" min="0" required></div>
                </div>
            </div>

            <!-- Red Velvet Classic -->
            <div class="flavor-section">
                <h4>Red Velvet Classic</h4>
                <div class="size-grid">
                    <div><label>BBZ</label><input type="number" name="rvcl_bbz" value="0" min="0" required></div>
                    <div><label>Regular</label><input type="number" name="rvcl_reg" value="0" min="0" required></div>
                    <div><label>Grande</label><input type="number" name="rvcl_grd" value="0" min="0" required></div>
                </div>
            </div>

            <hr>
            <div class="form-group">
                <label>Email Address:</label>
                <input type="email" name="email" required>
            </div>

            <button type="submit">Submit Report</button>
        </form>
    </div>
</body>
</html>
